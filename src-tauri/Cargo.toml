[package]
name = "cabinet"
version = "0.1.0"
description = "Cabinet: a fast cross-store game launcher"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cabinet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
ureq = { version = "3.5.2", features = ["platform-verifier"] }
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
anyhow = "1.0.104"
base64 = "0.23.1"
sha2 = "0.11.1"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
